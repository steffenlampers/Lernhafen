# Lernhafen MIT eingebautem Office (Word, Excel, PowerPoint im Browser, über Collabora Online).
# Starten:  docker compose -f docker-compose.office.yml up -d       Aktualisieren:  sh update.sh docker-compose.office.yml
# Im Browser: http://<NAS-Adresse>:8088   (das Office läuft im Hintergrund auf Port 9980 und muss vom Browser erreichbar sein)
# Hinweis: Das Office braucht etwa 1 GB Arbeitsspeicher und läuft auf x86-NAS am besten.
services:
  lernhafen:
    image: ghcr.io/steffenlampers/lernhafen:${LERNHAFEN_VERSION:-latest}
    container_name: lernhafen
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:${PORT:-8088}"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PORT: ${PORT:-8088}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_NAME: ${APP_NAME:-Lernhafen}
      PROFILE: ${PROFILE:-allgemein}
      SYNC_HOUR: ${SYNC_HOUR:-6}
      OCR_LANG: ${OCR_LANG:-deu+eng}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COLLABORA_URL: http://collabora:9980          # so erreicht Lernhafen das Office innerhalb von Docker
      WOPI_HOST_URL: http://lernhafen:${PORT:-8088}  # so erreicht das Office Lernhafen
    volumes:
      - ./data:/data
    depends_on:
      - collabora
    security_opt:
      - no-new-privileges:true

  collabora:
    image: collabora/code:latest
    container_name: lernhafen-office
    restart: unless-stopped
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    environment:
      # Das Office darf Dateien nur bei Lernhafen holen; das Einbetten in die App ist von überall im Heimnetz erlaubt.
      aliasgroup1: http://lernhafen:${PORT:-8088}
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=* --o:user_interface.mode=classic
      dictionaries: de en
    cap_add:
      - MKNOD
