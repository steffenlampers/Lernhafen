name: Docker-Image

# Testet den Code, baut das Image, prüft es mit einem Start-Test und veröffentlicht es
# für x86-64 (amd64) und ARM (arm64) auf ghcr.io/<besitzer>/lernhafen.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tests
        run: |
          npm ci
          npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image bauen (amd64) für den Start-Test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lernhafen:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start-Test
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name lernhafen-test -p 8088:8088 -e APP_PASSWORD=smoketest-passwort -v "$RUNNER_TEMP/data:/data" lernhafen:test
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8088/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8088/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8088/ | grep -q "Lernhafen"
          curl -fsS http://127.0.0.1:8088/api/session | grep -q '"loginRequired":true'
          # ohne Anmeldung kein Zugriff auf Daten
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/state)" = "401"
          # Texterkennung ist installiert: Deutsch vorhanden, PDF-Schrift vorhanden
          docker exec lernhafen-test sh -c 'tesseract --list-langs | grep -q deu && test -f /usr/share/tessdata/pdf.ttf'
          # Prozess läuft ohne Root-Rechte
          docker exec lernhafen-test sh -c 'ps -o user,args | grep "[s]rc/server.js" | grep -q "^node"'
          docker logs lernhafen-test

      - name: Log-Ausgabe bei Fehler
        if: failure()
        run: docker logs lernhafen-test || true

      - name: Anmelden bei ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lernhafen
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Multi-Arch-Image veröffentlichen (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
